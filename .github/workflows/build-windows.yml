name: Gerar instalador Windows

# Roda sozinho a cada push e também manualmente (aba Actions > Run workflow).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Gerar instalador
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Corrida-do-Saber-Setup
          path: dist/*.exe
          if-no-files-found: error
