<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corrida do Saber</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="hud">
      <div class="hud-block">
        <span class="hud-label">Energia</span>
        <div class="bar"><div id="energyFill"></div></div>
      </div>
      <div class="hud-block"><span class="hud-label">Distância</span><strong id="dist">0 m</strong></div>
      <div class="hud-block"><span class="hud-label">Ritmo</span><strong id="pace">normal</strong></div>
      <div class="hud-block"><span class="hud-label">Corrida</span><strong id="runInfo">-</strong></div>
    </section>
    <div id="stage">
      <canvas id="game" width="900" height="300"></canvas>
    </div>
    <p id="hint">Espaço ou ↑ para pular · ↓ para abaixar</p>
  </main>
  <div id="overlay" class="hidden"></div>
  <div id="adminRoot" class="hidden"></div>
  <script src="defaults.js"></script>
  <script src="questions.js"></script>
  <script src="browser-api.js"></script>
  <script src="admin.js"></script>
  <script src="game.js"></script>
</body>
</html>
